# Reference model: Qwen3-4B-Base fine-tuned on OpenThoughts3-1.2M.
model:
  base: ${MODEL_DIR}/Qwen3-4B-Base
data:
  cache_dir: ${DATA_DIR}/ot3_cache_len16384
  max_len: 16384
train:
  output: ${MODEL_DIR}/Qwen3-4B-OT3
  epochs: 2.0
  lr: 8.0e-5
  batch_size: 512
  per_device_bs: 4
  save_steps: 100
