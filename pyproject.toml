[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immopd"
version = "1.0.0"
description = "Iterative merging for multi-teacher on-policy distillation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["immopd*", "third_party*"]
